[package]
name = "shouci-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crossterm = "0.29.0"
ratatui = "0.29.0"
# Native save/open panel. Default features are off on purpose: they pull in the
# xdg-portal and wayland stacks, and the typed-path prompt is the fallback
# wherever no panel can open (headless, SSH, no portal).
rfd = { version = "0.17.2", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
vocab-core = { path = "../vocab-core" }
vocab-db = { path = "../vocab-db" }
vocab-dictionary = { path = "../vocab-dictionary" }
vocab-pinyin = { path = "../vocab-pinyin" }
vocab-capture = { path = "../vocab-capture" }
vocab-exchange = { path = "../vocab-exchange" }
vocab-search = { path = "../vocab-search" }

[lints]
workspace = true
