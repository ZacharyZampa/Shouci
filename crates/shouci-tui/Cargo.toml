[package]
name = "shouci-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crossterm = "0.29.0"
ratatui = "0.29.0"
# Native save/open panel. Default features are off on purpose: they pull in the
# xdg-portal and wayland stacks, and the typed-path prompt is the fallback
# wherever no panel can open (headless, SSH, no portal).
rfd = { version = "0.17.2", default-features = false }
shouci-core = { path = "../shouci-core" }

[dev-dependencies]
# Tests drive the app over a scratch library with the sample dictionary.
shouci-core = { path = "../shouci-core", features = ["test-support"] }

[lints]
workspace = true
