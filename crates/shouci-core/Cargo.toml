[package]
name = "shouci-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Connectors are compiled in by feature. Adding a format means a new crate,
# a feature here, and one line in `connectors.rs`.
[features]
default = ["pleco", "anki"]
pleco = ["dep:vocab-pleco"]
anki = ["dep:vocab-anki"]
# Sandboxed libraries with a fixture dictionary, for frontend tests.
test-support = []

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
vocab-anki = { path = "../vocab-anki", optional = true }
vocab-core = { path = "../vocab-core", features = ["serde"] }
vocab-db = { path = "../vocab-db" }
vocab-dictionary = { path = "../vocab-dictionary" }
vocab-exchange = { path = "../vocab-exchange" }
vocab-pinyin = { path = "../vocab-pinyin" }
vocab-pleco = { path = "../vocab-pleco", optional = true }
vocab-search = { path = "../vocab-search", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
# Integration tests use the sandbox helpers.
shouci-core = { path = ".", features = ["test-support"] }

[lints]
workspace = true
