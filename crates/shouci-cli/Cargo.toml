[package]
name = "shouci-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "shouci"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shouci-core = { path = "../shouci-core" }

[dev-dependencies]
# The end-to-end tests build the sample dictionary into a scratch library.
shouci-core = { path = "../shouci-core", features = ["test-support"] }

[lints]
workspace = true
