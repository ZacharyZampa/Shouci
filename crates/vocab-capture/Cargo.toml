[package]
name = "vocab-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
clap = ["dep:clap"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
vocab-core = { path = "../vocab-core" }
vocab-db = { path = "../vocab-db" }
vocab-dictionary = { path = "../vocab-dictionary" }
vocab-pinyin = { path = "../vocab-pinyin" }
vocab-search = { path = "../vocab-search" }

[lints]
workspace = true
