[workspace]
resolver = "3"
members = [
    "crates/shouci-cli",
    "crates/shouci-mac",
    "crates/shouci-tui",
    "crates/vocab-capture",
    "crates/vocab-core",
    "crates/vocab-db",
    "crates/vocab-dictionary",
    "crates/vocab-pinyin",
    "crates/vocab-pleco",
    "crates/vocab-search",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
