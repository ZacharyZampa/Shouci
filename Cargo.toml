[workspace]
resolver = "3"
members = [
    "crates/shouci-cli",
    "crates/shouci-core",
    "crates/shouci-ffi",
    "crates/shouci-tui",
    "crates/vocab-anki",
    "crates/vocab-core",
    "crates/vocab-db",
    "crates/vocab-dictionary",
    "crates/vocab-exchange",
    "crates/vocab-pinyin",
    "crates/vocab-pleco",
    "crates/vocab-search",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# SQLite is compiled from C source (rusqlite's `bundled`). Unoptimized, its
# FTS and LIKE scans make debug builds, and the search-quality tests, many
# times slower. Optimizing just that crate keeps debug builds quick to compile.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
